name: InFraX bounded public source collection (manual, no deployment)
on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        required: true
        default: eia
        options: [eia, osm]
permissions: {contents: read}
concurrency:
  group: infrax-public-data-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref_name == 'feat/infrax-runtime-integration-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate parsers and import boundaries
        run: python -m unittest discover -s scripts/ingestion -p 'test_*.py' -v
      - name: Collect EIA independently of map availability
        if: inputs.source == 'eia'
        run: |
          python scripts/ingestion/collect-public-pilot.py --output public-pilot --source eia
          python scripts/ingestion/prepare-pilot-import.py --bundle public-pilot/public-pilot.json --output public-pilot/eia-transaction.json --environment development
      - name: Collect OSM as its own explicitly requested job
        if: inputs.source == 'osm'
        run: python scripts/ingestion/collect-osm-pilot.py --output public-pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'infrax-public-pilot-${{ inputs.source }}', path: public-pilot/, retention-days: 3, if-no-files-found: error}
