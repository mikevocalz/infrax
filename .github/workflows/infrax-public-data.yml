name: InFraX bounded public source collection (no deployment)
on:
  pull_request:
    paths:
      - 'scripts/ingestion/**'
      - '.github/workflows/infrax-public-data.yml'
permissions:
  contents: read
concurrency:
  group: infrax-public-data-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/infrax-runtime-integration-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate parsers, redaction and import boundaries
        run: python -m unittest discover -s scripts/ingestion -p 'test_*.py' -v
      - name: Collect bounded EIA and OSM evidence
        run: |
          python scripts/ingestion/collect-public-pilot.py --output public-pilot --source eia
          python scripts/ingestion/collect-osm-pilot.py --output public-pilot
      - name: Prepare development-only EIA import for review (does not execute SQL)
        run: python scripts/ingestion/prepare-pilot-import.py --bundle public-pilot/public-pilot.json --output public-pilot/eia-transaction.json --environment development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrax-public-pilot
          path: public-pilot/
          retention-days: 3
          if-no-files-found: error
