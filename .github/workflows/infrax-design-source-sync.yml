name: Persist reviewed InFraX preview source
on:
  push:
    branches: [feat/infrax-complete-site-preview-20261108]
    paths: ['docs/design/preview-source-manifest.json']
permissions:
  contents: write
concurrency:
  group: infrax-design-source-snapshot
  cancel-in-progress: false
jobs:
  persist-source:
    if: github.repository == 'mikevocalz/infrax' && github.ref == 'refs/heads/feat/infrax-complete-site-preview-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/infrax-complete-site-preview-20261108
          persist-credentials: false
      - name: Validate and restore reviewed source bytes
        run: node scripts/restore-design-preview.mjs
      - name: Commit recovered source to the draft branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- design-preview docs/design/preview-source-receipt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(design): persist reviewed complete InFraX preview source'
          gh auth setup-git
          git push origin HEAD:refs/heads/feat/infrax-complete-site-preview-20261108
