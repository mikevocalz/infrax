name: InFraX client source pack (no deployment or database writes)
on:
  pull_request:
    paths: ['.github/workflows/infrax-client-source-pack.yml']
permissions:
  contents: read
jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download reviewed official bulk files with size and host boundaries
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, time, urllib.request, urllib.parse, zipfile
          out=pathlib.Path('source-pack'); out.mkdir()
          sources=[
            ('S03','EIA annual generator inventory 2025','https://www.eia.gov/electricity/data/eia860/xls/eia8602025.zip','eia860_2025.zip','https://www.eia.gov/electricity/data/eia860/','EIA public-domain data; retain source/date acknowledgment.'),
            ('S04','EIA monthly generator inventory September 2026','https://www.eia.gov/electricity/data/eia860m/xls/september_generator2026.xlsx','eia860m_2026-09.xlsx','https://www.eia.gov/electricity/data/eia860m/','EIA public-domain data; estimates are preliminary, not service commitments.'),
            ('S05','EIA utility survey 2025','https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip','eia861_2025.zip','https://www.eia.gov/electricity/data/eia861/','EIA public-domain data; county reporting is not an exact utility territory.'),
            ('S06','EIA generation and fuel survey 2025','https://www.eia.gov/electricity/data/eia923/xls/f923_2025.zip','eia923_2025.zip','https://www.eia.gov/electricity/data/eia923/','EIA public-domain data; generation is not capacity for a new customer.'),
            ('S12','Berkeley Lab Queued Up 2026 edition','https://eta-publications.lbl.gov/sites/default/files/2026-05/lbnl_ix_queue_data_file_thru2025.xlsx','lbnl_queue_through_2025.xlsx','https://emp.lbl.gov/queues','CC BY 4.0. Attribution: Lawrence Berkeley National Laboratory and GridTracker, Queued Up data file, 2026 edition. Unmodified original. Generation/storage queues, not large-load approvals.'),
            ('S21','EPA eGRID 2023 revision 2','https://www.epa.gov/system/files/documents/2025-06/egrid2023_data_rev2.xlsx','egrid2023_revision2.xlsx','https://www.epa.gov/egrid/detailed-data','EPA eGRID2023 revision 2, June 12 2025. Environmental context, not facility renewable certification.')
          ]
          approved={'www.eia.gov','www.epa.gov','eta-publications.lbl.gov'}
          class Redirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              u=urllib.parse.urlsplit(newurl)
              if u.scheme!='https' or u.hostname not in approved or u.username or u.password: raise ValueError('Unapproved redirect')
              return super().redirect_request(req,fp,code,msg,headers,newurl)
          def collect(row):
            sid,title,url,name,landing,rights=row
            record={'source_id':sid,'title':title,'url':url,'publisher_page':landing,'file':name,'rights_note':rights,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'database_imported':False,'public_app_published':False}
            path=out/name; partial=out/(name+'.partial')
            try:
              op=urllib.request.build_opener(Redirect())
              req=urllib.request.Request(url,headers={'User-Agent':'InFraX-SourceReview/1.0 (bounded public research)','Accept':'application/octet-stream,*/*'})
              start=time.monotonic(); count=0; digest=hashlib.sha256()
              with op.open(req,timeout=40) as response, partial.open('wb') as target:
                record['http_status']=response.status
                record['content_type']=response.headers.get('Content-Type','')
                record['last_modified']=response.headers.get('Last-Modified')
                while True:
                  chunk=response.read(256*1024)
                  if not chunk: break
                  count+=len(chunk)
                  if count>40*1024*1024 or time.monotonic()-start>110: raise ValueError('Size/time boundary exceeded')
                  digest.update(chunk);target.write(chunk)
              if not zipfile.is_zipfile(partial): raise ValueError('Expected ZIP or XLSX; no data accepted')
              with zipfile.ZipFile(partial) as z:
                if sum(i.file_size for i in z.infolist())>350*1024*1024: raise ValueError('Archive expanded-size boundary')
                bad=z.testzip()
                if bad: raise ValueError('Archive checksum failure')
                record['archive_members']=[{'name':i.filename,'bytes':i.file_size} for i in z.infolist() if not i.is_dir()]
              partial.replace(path)
              record.update(status='downloaded_valid_archive',bytes=count,sha256=digest.hexdigest())
            except Exception as exc:
              partial.unlink(missing_ok=True)
              record.update(status='failed',error=type(exc).__name__+': '+str(exc)[:240])
            return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
            results=list(pool.map(collect,sources))
          (out/'manifest.json').write_text(json.dumps({'scope':'Client review copies only. No database writes or scheduled feeds. These are not data-center availability offers.','created_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sources':results},indent=2))
          (out/'README.txt').write_text('InFraX client-review data pack\nOriginal publisher downloads, unchanged. Consult manifest.json for source URLs, revisions, hashes, individual outcomes and attribution. No customer inventory or confirmed MW. Downloaded does not mean imported, published, or approved for every reuse. Preserve all original workbook notes.\nBerkeley Lab attribution: Lawrence Berkeley National Laboratory and GridTracker, Queued Up data file, 2026 edition; CC BY 4.0 https://creativecommons.org/licenses/by/4.0/. Unmodified.\nEIA data: https://www.eia.gov/about/copyrights_reuse.php. EPA data: https://www.epa.gov/egrid/detailed-data.\n')
          print(json.dumps([{'id':r['source_id'],'status':r['status'],'bytes':r.get('bytes',0)} for r in results],indent=2))
          if any(r['status']=='failed' for r in results): raise SystemExit('One or more sources failed; see per-source manifest. Successful files retained.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrax-client-source-pack
          path: source-pack/
          retention-days: 7
