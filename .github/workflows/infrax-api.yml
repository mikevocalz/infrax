name: InFraX runtime integration (no deployment)
on:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test backend/*.test.mjs lib/ingestion/*.test.mjs lib/infra/*.test.mjs cms/policy.test.mjs
  runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: infrax-ci-only, POSTGRES_DB: infrax}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d infrax"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: 'true'
      INFRAX_CMS_TEST_MODE: '1'
      APP_ENV: development
      INFRAX_CMS_DATABASE_URL: postgresql://postgres:infrax-ci-only@127.0.0.1:5432/infrax
      INFRAX_PUBLIC_ORIGIN: http://127.0.0.1:3000
      INFRAX_AUTH_BASE_URL: http://127.0.0.1:3000/api/auth
      INFRAX_ALLOW_SIGNUP: 'true'
      PAYLOAD_SECRET: ci-only-payload-secret-not-valid-for-any-customer-environment
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-not-valid-for-any-customer-environment
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Resolve upgraded dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - run: npm run cms:importmap && npm run cms:types
      - name: Generate initial migration only if absent
        run: |
          if ! find cms/migrations -maxdepth 1 -name '*_*.ts' 2>/dev/null | grep -q .; then
            npm run payload -- migrate:create initial_auth_editorial --force-accept-warning
          fi
      - name: Apply generated migrations to disposable database
        run: npm run cms:migrate
      - run: npm run typecheck
      - run: npm run build
      - name: Seed only CI editorial fixtures
        run: npx tsx cms/seed-ci.ts
      - name: Run real HTTP authentication checks
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/infrax-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/auth/get-session >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then tail -100 /tmp/infrax-server.log; exit 1; fi
          npm run test:cms:http
      - name: Collect generated non-secret files
        run: |
          mkdir -p generated/cms generated/app/'(payload)'/admin
          cp package-lock.json generated/
          cp cms/payload-types.ts generated/cms/
          cp -R cms/migrations generated/cms/
          cp app/'(payload)'/admin/importMap.* generated/app/'(payload)'/admin/
      - uses: actions/upload-artifact@v4
        with:
          name: tested-cms-generated
          path: generated/
          retention-days: 3
  persist-generated:
    needs: [runtime, contracts]
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/infrax-runtime-integration-20261106'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: tested-cms-generated, path: generated}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.payload.pull_request.head.ref;
            const expected=context.payload.pull_request.head.sha;
            const ref=await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
            if(ref.data.object.sha!==expected)throw new Error('Branch advanced; refusing generated-file overwrite');
            const commit=await github.rest.git.getCommit({owner,repo,commit_sha:expected});
            const entries=[];
            function walk(dir,relative=''){
              for(const item of fs.readdirSync(dir,{withFileTypes:true})){
                const rel=relative?relative+'/'+item.name:item.name;
                const full=path.join(dir,item.name);
                if(item.isDirectory())walk(full,rel);
                else {
                  if(!/^(package-lock\.json|cms\/payload-types\.ts|cms\/migrations\/[A-Za-z0-9_.-]+\.(ts|json)|app\/\(payload\)\/admin\/importMap\.(js|ts))$/.test(rel))throw new Error('Unexpected generated path');
                  entries.push({path:rel,mode:'100644',type:'blob',content:fs.readFileSync(full,'utf8')});
                }
              }
            }
            walk('generated');
            const tree=await github.rest.git.createTree({owner,repo,base_tree:commit.data.tree.sha,tree:entries});
            if(tree.data.sha===commit.data.tree.sha){core.info('Generated files already match');return;}
            const created=await github.rest.git.createCommit({owner,repo,message:'build: persist CI-tested lockfile and generated Payload schema',tree:tree.data.sha,parents:[expected]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:created.data.sha,force:false});
