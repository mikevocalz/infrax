name: InFraX API integration (no deployment)
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'lib/server/**'
      - 'lib/ingestion/**'
      - 'app/api/**'
      - 'db/**'
      - 'package.json'
      - '.github/workflows/infrax-api-integration.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test backend/*.test.mjs lib/ingestion/*.test.mjs lib/infra/*.test.mjs
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix backend ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      # No credentials, live database migration, deployment, ingestion or mail in CI.
